<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>PetCare - {% block titulo %}Início{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topo">
        <div class="marca">
            <span>🐾</span>
            <span>PetCare</span>
        </div>
        <nav>
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('listar_clientes') }}">Clientes</a>
            <a href="{{ url_for('listar_pets') }}">Pets</a>
            <a href="{{ url_for('listar_funcionarios') }}">Funcionários</a>
        </nav>
    </header>

    <main class="conteudo">
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
