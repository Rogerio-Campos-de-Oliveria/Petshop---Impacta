{% extends "base.html" %}
{% block titulo %}Editar Cliente{% endblock %}
{% block conteudo %}
<h1>Editar Cliente</h1>

<form class="formulario" method="POST" action="{{ url_for('editar_cliente', cliente_id=cliente.id) }}">
    <div class="campo">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome" value="{{ cliente.nome }}" required>
    </div>
    <div class="campo">
        <label for="telefone">Telefone *</label>
        <input type="text" id="telefone" name="telefone" value="{{ cliente.telefone }}" required>
    </div>
    <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" value="{{ cliente.email or '' }}">
    </div>
    <div class="campo">
        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" name="endereco" value="{{ cliente.endereco or '' }}">
    </div>
    <button type="submit">Salvar alterações</button>
</form>

<p><a href="{{ url_for('listar_clientes') }}">← Voltar para a lista</a></p>
{% endblock %}
