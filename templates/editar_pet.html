{% extends "base.html" %}
{% block titulo %}Editar Pet{% endblock %}
{% block conteudo %}
<h1>Editar Pet</h1>

<form class="formulario" method="POST" action="{{ url_for('editar_pet', pet_id=pet.id) }}">
    <div class="campo">
        <label for="nome">Nome do pet *</label>
        <input type="text" id="nome" name="nome" value="{{ pet.nome }}" required>
    </div>
    <div class="campo">
        <label for="especie">Espécie *</label>
        <input type="text" id="especie" name="especie" value="{{ pet.especie }}" required>
    </div>
    <div class="campo">
        <label for="raca">Raça</label>
        <input type="text" id="raca" name="raca" value="{{ pet.raca or '' }}">
    </div>
    <div class="campo">
        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade" min="0" value="{{ pet.idade or '' }}">
    </div>
    <div class="campo">
        <label for="cliente_id">Tutor *</label>
        <select id="cliente_id" name="cliente_id" required>
            {% for c in clientes %}
            <option value="{{ c.id }}" {% if c.id == pet.cliente_id %}selected{% endif %}>{{ c.nome }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit">Salvar alterações</button>
</form>

<p><a href="{{ url_for('listar_pets') }}">← Voltar para a lista</a></p>
{% endblock %}
